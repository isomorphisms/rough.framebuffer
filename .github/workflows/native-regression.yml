name: Native framebuffer regression

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  native:
    name: ${{ matrix.compiler }} strict and sanitizer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Strict native integration
        run: |
          set -eu
          make clean test CC=${{ matrix.compiler }}
      - name: Native ASan/UBSan regression
        run: |
          set -eu
          make clean test CC=${{ matrix.compiler }} CFLAGS='-O1 -g -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Reject known-bad nonperiodic torus material
        if: matrix.compiler == 'gcc'
        run: |
          set -eu
          sed -e 's/sin(u)/sin(1.3 * u)/' -e 's/cos(2.0 \* v)/cos(1.8 * v)/' src/surface.c > build/mutant_surface.c
          grep -q 'sin(1.3 \* u)' build/mutant_surface.c
          grep -q 'cos(1.8 \* v)' build/mutant_surface.c
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Isrc tests/test_surface.c build/mutant_surface.c src/framebuffer.c -o build/test-surface-mutant -lm
          if (ulimit -c 0; ./build/test-surface-mutant > build/mutant.log 2>&1); then
            echo 'bad nonperiodic palette passed surface checks' >&2
            exit 1
          fi
          grep -q 'torus seam palette jump' build/mutant.log
      - name: Kill the human-found backwards hemisphere rotation mutant
        if: matrix.compiler == 'gcc'
        run: |
          set -eu
          sed 's/state->anchor_yaw -/state->anchor_yaw +/' src/touch.c > build/bad_backside_rotation.c
          grep -Fq 'state->anchor_yaw +' build/bad_backside_rotation.c
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Isrc \
            tests/test_rotation_grab.c build/bad_backside_rotation.c \
            src/surface.c src/framebuffer.c -lm -o build/test-backside-mutant
          if (ulimit -c 0; ./build/test-backside-mutant > build/bad_backside.log 2>&1); then
            echo 'BACKSIDE_ROTATION_FALSE_PASS: inverted near-side sign accepted' >&2
            exit 1
          fi
          grep -Fq 'FRONT_HEMISPHERE_WRONG_DIRECTION:' build/bad_backside.log
          echo 'BACKSIDE_ROTATION_MUTANT_KILLED: near-side grip direction enforced'
      - name: Reject the old one-sample contour renderer
        if: matrix.compiler == 'gcc'
        run: |
          set -eu
          sed 's/return rough_resolve_2x2(scratch, destination);/return rough_draw_surface(destination, shape, angle_degrees, camera_distance);/' src/surface_aa.c > build/single_sample_mutant.c
          grep -Fq 'return rough_draw_surface(destination, shape, angle_degrees, camera_distance);' build/single_sample_mutant.c
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Isrc tests/test_surface_aa.c build/single_sample_mutant.c src/surface.c src/framebuffer.c -o build/aa-single-sample-mutant -lm
          if (ulimit -c 0; ./build/aa-single-sample-mutant > build/bad_single_sample.log 2>&1); then
            echo 'AA false pass: old center-sample rendering accepted' >&2
            exit 1
          fi
          grep -Fq 'changed > 20u' build/bad_single_sample.log
          echo 'AA_SUBPIXEL_MUTANT_KILLED'

      - name: Kill constant-normal flat shading mutant
        if: matrix.compiler == 'gcc'
        run: |
          set -eu
          python3 - <<'PY'
          from pathlib import Path
          source = Path('src/framebuffer.c').read_text()
          begin = source.index('            double nx = k0 * v0.normal_x')
          end = source.index('            double normal_length =', begin)
          source = source[:begin] + ('            double nx = v0.normal_x;\n'
                                      '            double ny = v0.normal_y;\n'
                                      '            double nz = v0.normal_z;\n') + source[end:]
          Path('build/flat_normal_mutant.c').write_text(source)
          PY
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Isrc \
            tests/test_smooth.c src/surface.c build/flat_normal_mutant.c \
            -lm -o build/test-flat-normal-mutant
          if (ulimit -c 0; ./build/test-flat-normal-mutant > build/flat_normal.log 2>&1); then
            echo 'Smooth shading false pass: constant normal accepted' >&2
            exit 1
          fi
          grep -Fq 'test_normal_is_evaluated_per_fragment' build/flat_normal.log
          echo 'SMOOTH_NORMAL_MUTANT_KILLED'
      - name: Render inspectable frames
        if: matrix.compiler == 'gcc'
        run: |
          set -eu
          ./build/rough-surface torus 40 160 160 > build/torus-40.ops
          ./build/rough-fb build/torus-40.ops build/torus-40.ppm 160 160
          ./build/rough-surface enneper 25 160 160 > build/enneper-25.ops
          ./build/rough-fb build/enneper-25.ops build/enneper-25.ppm 160 160
          sha256sum build/torus-40.ops build/torus-40.ppm build/enneper-25.ops build/enneper-25.ppm
