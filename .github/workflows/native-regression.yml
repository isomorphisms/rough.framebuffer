name: Native framebuffer regression

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  native:
    name: ${{ matrix.compiler }} strict and sanitizer
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Strict native integration
        run: |
          set -eu
          make clean test CC=${{ matrix.compiler }}
      - name: Native ASan/UBSan regression
        run: |
          set -eu
          make clean test CC=${{ matrix.compiler }} CFLAGS='-O1 -g -std=c11 -Wall -Wextra -Werror -pedantic -fsanitize=address,undefined -fno-omit-frame-pointer'
      - name: Reject known-bad nonperiodic torus material
        if: matrix.compiler == 'gcc'
        run: |
          set -eu
          sed -e 's/sin(u)/sin(1.3 * u)/' -e 's/cos(2.0 \* v)/cos(1.8 * v)/' src/surface.c > build/mutant_surface.c
          grep -q 'sin(1.3 \* u)' build/mutant_surface.c
          grep -q 'cos(1.8 \* v)' build/mutant_surface.c
          gcc -O2 -std=c11 -Wall -Wextra -Werror -pedantic -Isrc tests/test_surface.c build/mutant_surface.c src/framebuffer.c -o build/test-surface-mutant -lm
          if (ulimit -c 0; ./build/test-surface-mutant > build/mutant.log 2>&1); then
            echo 'bad nonperiodic palette passed surface checks' >&2
            exit 1
          fi
          grep -q 'torus seam palette jump' build/mutant.log
      - name: Render inspectable frames
        if: matrix.compiler == 'gcc'
        run: |
          set -eu
          ./build/rough-surface torus 40 160 160 > build/torus-40.ops
          ./build/rough-fb build/torus-40.ops build/torus-40.ppm 160 160
          ./build/rough-surface enneper 25 160 160 > build/enneper-25.ops
          ./build/rough-fb build/enneper-25.ops build/enneper-25.ppm 160 160
          sha256sum build/torus-40.ops build/torus-40.ppm build/enneper-25.ops build/enneper-25.ppm
