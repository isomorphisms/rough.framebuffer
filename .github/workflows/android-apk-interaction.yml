name: Current-head Android APK, FP acceptance and emulator pixels

on:
  pull_request:
    paths:
      - 'android/**'
      - 'src/**'
      - 'subpixel/**'
      - 'ci/**'
      - '.github/workflows/android-apk-interaction.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  apk-and-emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ASAN_OPTIONS: detect_leaks=0
    steps:
      - name: Check out exact candidate, never the synthetic merge ref
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Check out maintained packager
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/android-NDK
          ref: 11edd1e0d9748d7c618413ec9f5afad52049046a
          path: _canonical_ndk
          persist-credentials: false
      - name: Check out accepted independent package and screenshot verifiers
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/ai-ci
          ref: 5ec09e2f8b38b8dcc97805da44b3b87c62224116
          path: _aici
          persist-credentials: false
      - name: Check out maintained FP package acceptance pipeline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/flexible-pipes
          ref: d70159ff1dddefb163eb32fdd1c51335b9128fdc
          path: _fp
          persist-credentials: false
      - name: Check out existing public test key, never generate a replacement
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphismes/wegert
          ref: 89dcfb840cec1a66ee04c7f7404954cbd6c09839
          path: _test_signing
          sparse-checkout: _/build/app/wegert-debug.keystore
          sparse-checkout-cone-mode: false
          persist-credentials: false
      # The existing narrow stage-zero bootstrap: Grease cannot fetch itself.
      - name: Materialize digest-pinned Grease and historical update baseline
        shell: sh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir -p _runtime/bin build/android/prior
          gh api repos/dilapidated-shed/grease/actions/artifacts/12192502970/zip > "$RUNNER_TEMP/grease.zip"
          printf '%s  %s\n' 295329ec3bb419d90364fcb5937eafe4306b03f68b7aaa63089dadde8082ffb5 "$RUNNER_TEMP/grease.zip" | sha256sum -c -
          unzip -p "$RUNNER_TEMP/grease.zip" _bin/cxx-asan/ysh > _runtime/bin/ysh
          printf '%s  %s\n' 7e31cd05b7a9d8fb2a4a9e003a7f3fcb0159138506d17f0fb28da8cbe22aa85c _runtime/bin/ysh | sha256sum -c -
          curl --fail --location --silent --show-error https://github.com/isomorphisms/grease/releases/download/tablet-aarch64-9b3dc8904891/grease-aarch64-termux.tar.gz --output "$RUNNER_TEMP/grease-portable.tar.gz"
          printf '%s  %s\n' 3ddb962ef313e528e525fa03518f494577e921c2201ecb49f7a11f2fbf4e82b2 "$RUNNER_TEMP/grease-portable.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/grease-portable.tar.gz" -C _runtime ./bin/grease
          printf '%s  %s\n' 37088097c36a2f82cf45aaea9392e4a4cf16155fecb9da87d08a9c7fb4d92e4a _runtime/bin/grease | sha256sum -c -
          chmod 755 _runtime/bin/grease _runtime/bin/ysh
          gh api repos/isomorphisms/rough.framebuffer/actions/artifacts/11688552306/zip > "$RUNNER_TEMP/rough-prior.zip"
          printf '%s  %s\n' 6f6f5ed114e1217a0a0a238acd15baa54ff6c6f4914be59a8abff2e930d7a3cd "$RUNNER_TEMP/rough-prior.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/rough-prior.zip" -d build/android/prior
      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
      - name: Install declared build-host inputs
        shell: '/usr/bin/env _runtime/bin/grease {0}'
        run: |
          set -o errexit -o nounset -o pipefail
          sdkmanager 'platforms;android-34' 'build-tools;35.0.0' 'ndk;27.2.12479018'
          sudo apt-get update -qq
          sudo apt-get install --yes --no-install-recommends ffmpeg
      - name: Compile full native closures without GNU Make
        shell: '/usr/bin/env _runtime/bin/grease {0}'
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: _runtime/bin/grease android/build-ndk.grease
      - name: Package and independently qualify actual APK bytes through FP
        shell: '/usr/bin/env _runtime/bin/grease {0}'
        env:
          ANDROID_NDK_REPO: ${{ github.workspace }}/_canonical_ndk
          AICI_CHECKOUT: ${{ github.workspace }}/_aici
          FP_CHECKOUT: ${{ github.workspace }}/_fp
          ROUGH_PRIOR_APK_DIRECTORY: ${{ github.workspace }}/build/android/prior
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_HOME }}/build-tools/35.0.0
          ANDROID_KEYSTORE: ${{ github.workspace }}/_test_signing/_/build/app/wegert-debug.keystore
          ANDROID_KEYSTORE_TYPE: PKCS12
          ANDROID_KEY_ALIAS: wegert-debug
          ANDROID_STORE_PASSWORD: wegert-debug
          ANDROID_KEY_PASSWORD: wegert-debug
        run: _runtime/bin/grease android/package-test.grease
      - name: Compile existing independent screen oracle and enable KVM
        shell: '/usr/bin/env _runtime/bin/grease {0}'
        run: |
          set -o errexit -o nounset -o pipefail
          cc -std=c17 -O2 -Wall -Wextra -Werror -pedantic _aici/framebuffer/verify_android_screens.c -o build/android/aici-screen-witness
          sudo chmod a+rw /dev/kvm
      - name: Execute Android 14 launch, drag, shape switch, zoom and restart
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: 34
          target: default
          arch: x86_64
          profile: medium_phone
          ram-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          script: _runtime/bin/grease android/emulator-check.grease
      - name: Retain tested APKs and current-head evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roughart-current-head-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/android/roughart-*.apk
            build/android/*.receipt.tsv
            build/android/*/elf-*.txt
            build/android/emulator/
            build/android/fp-runs/
          include-hidden-files: true
          if-no-files-found: error
      - name: Preserve failed-attempt diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: roughart-failed-attempt-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            build/android/
            build/android/fp-runs/
          include-hidden-files: true
          if-no-files-found: warn
